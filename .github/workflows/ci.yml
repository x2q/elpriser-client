name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Type-level tests against the built declarations
        run: npm run test:types
      - name: Smoke tests of the built package (ESM and CommonJS)
        run: npm run test:dist

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The tarball is dist + README + LICENSE only
        run: node scripts/check-pack.mjs
      - run: npx --yes publint@0.3.25
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack
